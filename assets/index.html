<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rayo</title>
<style>
:root{--bg:#f6f4ee;--surface:#fff;--text:#1f2430;--muted:#6b7280;--accent:#d92b2b;--accent2:#ff8a1f;--bubble:#eef0f4;--border:#e3e0d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181d;--surface:#20232b;--text:#eceef3;--muted:#9aa1b0;--bubble:#2b2f39;--border:#343947}}
:root[data-theme="dark"]{--bg:#16181d;--surface:#20232b;--text:#eceef3;--muted:#9aa1b0;--bubble:#2b2f39;--border:#343947}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:620px;margin:0 auto;padding:56px 22px;text-align:center}
main h1{font-size:2rem;margin:0 0 10px}
main p{color:var(--muted);line-height:1.6;margin:0 auto 10px;max-width:46ch}
#pet{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:84px;height:84px;z-index:20;touch-action:none;cursor:grab;user-select:none;animation:float 2.6s ease-in-out infinite}
#pet.drag{cursor:grabbing;animation:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes zap{0%,88%,100%{opacity:0}90%,96%{opacity:1}}
@keyframes lines{0%{transform:translateX(8px);opacity:0}30%{opacity:.9}100%{transform:translateX(-10px);opacity:0}}
.zap{animation:zap 3.4s infinite}.sl{animation:lines 1s linear infinite}.sl:nth-child(2){animation-delay:.3s}.sl:nth-child(3){animation-delay:.6s}
#pet svg{overflow:visible}
#pet svg{width:100%;height:100%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.22))}
.eye{transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#hint{position:absolute;right:92px;top:8px;background:var(--surface);color:var(--text);border:1px solid var(--border);padding:7px 11px;border-radius:14px;font-size:.85rem;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.12)}
#panel{position:fixed;right:14px;bottom:calc(116px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 28px));height:min(560px,calc(100vh - 150px));background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.28);display:none;flex-direction:column;z-index:19;overflow:hidden}
#panel.open{display:flex}
.head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff}
.head b{font-size:1rem}.head small{opacity:.9;display:block;font-size:.75rem}
.head button{margin-left:auto;background:rgba(255,255,255,.25);border:0;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:1rem}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:9px 12px;border-radius:16px;line-height:1.5;font-size:.94rem;word-wrap:break-word;overflow-wrap:anywhere}
.m.bot{background:var(--bubble);border-bottom-left-radius:5px;align-self:flex-start}
.m.me{background:var(--accent);color:#fff;border-bottom-right-radius:5px;align-self:flex-end;white-space:pre-wrap}
.m code{background:rgba(127,127,127,.2);padding:1px 5px;border-radius:5px;font-size:.88em}
.m pre{background:rgba(127,127,127,.18);padding:8px;border-radius:8px;overflow-x:auto;margin:6px 0}
.m p{margin:0 0 6px}.m p:last-child{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 11px;font-size:.82rem;cursor:pointer}
.chips button:hover{border-color:var(--accent)}
form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}
#q{flex:1;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit;font-size:.94rem;min-width:0}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
.send,.mic{border:0;border-radius:12px;padding:0 14px;cursor:pointer;font-size:1rem}
.send{background:var(--accent);color:#fff}.send:disabled{opacity:.5}
.mic{background:var(--bubble);color:var(--text)}.mic.on{background:#e5484d;color:#fff}

.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .45s ease-in-out infinite alternate}
.fl.b{animation-duration:.33s;animation-delay:-.2s}.fl.c{animation-duration:.52s;animation-delay:-.1s}
@keyframes flick{0%{transform:scale(1,.88) skewX(-4deg)}100%{transform:scale(.93,1.12) skewX(5deg)}}
.aura{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.06)}}
.ring{transform-box:fill-box;transform-origin:50% 50%;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sp{animation:rise 1.4s ease-out infinite}.sp:nth-of-type(2){animation-delay:.35s}.sp:nth-of-type(3){animation-delay:.7s}.sp:nth-of-type(4){animation-delay:1.05s}
@keyframes rise{0%{transform:translateY(8px);opacity:0}25%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.arc{animation:zap 1.1s infinite}.arc.d{animation-delay:.5s}
.head button+button{margin-left:6px}
#pet svg{transition:transform .35s ease}
.wing{transform-box:view-box;transform-origin:18px 60px;animation:flap .55s ease-in-out infinite alternate}
.wing.w2{animation-delay:-.05s}
@keyframes flap{0%{transform:rotate(-13deg) scale(.96)}100%{transform:rotate(13deg) scale(1.04)}}

:root{padding:0!important}
html,body{background:transparent!important;margin:0;height:100%;min-height:0;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;-webkit-tap-highlight-color:transparent}
body.open{justify-content:flex-end;align-items:stretch;padding:6px}
#pet{position:relative!important;right:auto!important;bottom:auto!important;margin:0;flex:none;width:96px;height:96px}
body.open #pet{align-self:flex-end;margin-top:4px}
#panel{position:static!important;width:100%!important;max-width:none!important;height:auto!important;flex:1;min-height:0;margin:0!important;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#hint{display:none!important}
.quick{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap}
.quick button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 11px;font-size:.82rem}
.m a{color:var(--accent);text-decoration:underline}
.m ul{margin:4px 0 0;padding-left:18px}.m li{margin-bottom:5px}
.src{font-size:.75rem;opacity:.7;margin-top:6px}

#cfg{display:none;flex:1;overflow-y:auto;padding:14px;font-size:.9rem}
#panel.cfgmode #cfg{display:block}
#panel.cfgmode #log,#panel.cfgmode .quick,#panel.cfgmode form{display:none}
#cfg p{margin:0 0 8px}#cfg .h{opacity:.75;font-size:.82rem;line-height:1.4}
#cfg label{display:block;margin:10px 0 4px;font-size:.8rem;opacity:.75}
#cfg input{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;padding:10px;font:inherit;font-size:16px}
#cfg .b1{margin-top:12px;width:100%;border:0;border-radius:10px;padding:11px;background:var(--accent);color:#fff;font-size:1rem}
#cfg .b2{margin:8px 6px 0 0;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 12px;font-size:.82rem}
.mi{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.mi button{border:0;background:transparent;color:var(--text);opacity:.6;font-size:1rem}
#memlist{margin-bottom:6px;opacity:.95}

.head button{width:28px!important;height:28px!important;font-size:.9rem!important}
.m{animation:mIn .22s ease-out}
@keyframes mIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:currentColor;opacity:.3;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
#cfg .chk{display:flex;gap:8px;align-items:center;margin:0 0 12px;font-size:.88rem;opacity:1}
#cfg .chk input{width:20px;height:20px;padding:0}
#pet.walk .wing{animation-duration:.3s}
#pet.dash .wing{animation-duration:.14s}
#pet.dash .aura{animation-duration:.35s}
#pet.dash .arc{animation-duration:.25s}
#pet.dash svg{filter:drop-shadow(0 0 6px #ffb02e) drop-shadow(0 0 12px #ff7a1a)}
#pet.think .ring{animation-duration:.8s}
#pet.think .aura{animation-duration:.5s}
#pet.drag svg{filter:drop-shadow(0 0 8px #ffd34d)}
#pet.land svg{animation:squash .5s ease-out}
@keyframes squash{0%{transform:scale(1.18,.8)}35%{transform:scale(.92,1.12)}65%{transform:scale(1.04,.97)}100%{transform:scale(1)}}
#pet::after{content:"";position:absolute;left:50%;top:60%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid rgba(255,211,77,.9);opacity:0;pointer-events:none}
#pet.land::after{animation:shock .55s ease-out}
@keyframes shock{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.9);opacity:0}}
#pet.happy{animation:hop .6s ease-out}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-14px) scale(1.06)}100%{transform:translateY(0)}}
</style></head><body>
<div id="panel">
  <div class="head"><div><b>Rayo ⚡</b><small>Conversa, busca y aprende</small></div><button id="snd" aria-label="Sonido" title="Sonido y vibración">🔊</button><button id="cfgb" aria-label="Ajustes" title="Ajustes">⚙️</button><button id="walk" aria-label="Paseo" title="Paseo">🏃</button><button id="x" aria-label="Cerrar">✕</button></div>
  <div id="cfg"><p class="h" id="streak"></p><label class="chk"><input type="checkbox" id="ctts"> Leer las respuestas en voz alta</label><p><b>Cerebro de IA (gratis)</b></p><p class="h">1) Pulsa «Abrir Groq», crea tu cuenta y en <i>API Keys</i> crea una clave.<br>2) Cópiala y pégala aquí abajo.</p><button type="button" class="b2" id="cgroq">Abrir Groq</button><label>Clave</label><input id="ckey" type="password" autocomplete="off" placeholder="gsk_..."><label>Modelo</label><input id="cmodel" autocomplete="off"><label>Dirección de la IA</label><input id="curl" autocomplete="off"><button type="button" class="b1" id="csave">Guardar</button><p><b>Lo que sé de ti</b></p><div id="memlist"></div><button type="button" class="b2" id="cclearmem">Borrar mi memoria</button><button type="button" class="b2" id="cclearhist">Borrar la conversación</button></div>
  <div class="quick" id="quick"></div>
  <div id="log"></div>
  <form id="f"><input id="q" placeholder="Pregunta o busca algo…" autocomplete="off"><button class="send" id="s">➤</button></form>

    var h=esc(parts[i]).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^\s*[-*] (.*)$/gm,'• $1');
    out+=h.split(/\n{2,}/).map(function(b){return b.trim()?'<p>'+b.replace(/\n/g,'<br>')+'</p>':''}).join('');
  }
  return out;
}
function typing(){var d=document.createElement('div');d.className='m bot';d.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function add(role,html,isText){var d=document.createElement('div');d.className='m '+role;if(isText)d.textContent=html;else d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function hora(ms){try{return new Date(ms).toLocaleString('es-PE',{timeZone:'America/Lima',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
async function getJSON(u){var r=await fetch(u);if(!r.ok)throw new Error('http '+r.status);return r.json()}
async function getText(u){var r=await fetch(u);if(!r.ok)throw new Error('http '+r.status);return r.text()}
var WC={0:'Despejado',1:'Mayormente despejado',2:'Parcialmente nublado',3:'Nublado',45:'Neblina',48:'Neblina',51:'Llovizna',53:'Llovizna',55:'Llovizna fuerte',61:'Lluvia ligera',63:'Lluvia',65:'Lluvia fuerte',80:'Chubascos',81:'Chubascos',82:'Chubascos fuertes',95:'Tormenta',96:'Tormenta',99:'Tormenta'};

// ---------- Datos de internet (devuelven texto para la IA y html para mostrar) ----------
async function dolar(){

   h:'<p><b>Dólar hoy: S/ '+p.toFixed(3)+'</b> por 1 USD (referencia internacional).</p><p>Las casas de cambio y los bancos del Perú pueden cotizar un poco distinto.</p><div class="src">Fuente: open.er-api.com</div>'};
}
async function clima(){
  var j=await getJSON('https://api.open-meteo.com/v1/forecast?latitude=-12.046&longitude=-77.043&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FLima&forecast_days=1');
  var c=j.current,d=j.daily,w=WC[c.weather_code]||'Variable';

}
async function noticias(qry){
  var term=(qry||'Perú').slice(0,90);
  var t=await getText('https://news.google.com/rss/search?q='+encodeURIComponent(term)+'&hl=es-419&gl=PE&ceid=PE:es-419');
  var xml=new DOMParser().parseFromString(t,'text/xml'),items=[].slice.call(xml.querySelectorAll('item')).slice(0,6);
  if(!items.length)throw new Error('sin noticias');
  var tt='Titulares recientes (Google Noticias) sobre "'+term+'":\n',h='<p><b>Titulares</b></p><ul>';
  items.forEach(function(it){var ti=it.querySelector('title').textContent,li=it.querySelector('link').textContent;tt+='- '+ti+'\n';h+='<li><a href="#" data-u="'+esc(li)+'">'+esc(ti)+'</a></li>'});
  return {t:tt,h:h+'</ul><div class="src">Fuente: Google Noticias. Toca un titular para abrirlo.</div>'};
}
async function sismos(){
  var j=await getJSON('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson');
  var l=j.features.filter(function(x){return /per[uú]/i.test(x.properties.place||'')}).slice(0,5);
  if(!l.length)return {t:'No hay sismos de magnitud 2,5 o más en Perú en las últimas 24 horas (USGS; el IGP tiene el detalle oficial).',h:'<p>No hay sismos de magnitud 2,5 o más en Perú en las últimas 24 horas.</p><div class="src">Fuente: USGS. El IGP tiene el detalle oficial.</div>'};
  var tt='Sismos recientes en Perú (USGS):\n',h='<p><b>Sismos recientes en Perú</b></p><ul>';
  l.forEach(function(x){tt+='- M '+x.properties.mag+', '+x.properties.place+', '+hora(x.properties.time)+'\n';h+='<li>M '+x.properties.mag+' · '+esc(x.properties.place)+' · '+hora(x.properties.time)+'</li>'});
  return {t:tt,h:h+'</ul><div class="src">Fuente: USGS. Para datos oficiales consulta al IGP.</div>'};
}
async function wiki(t){
  var s=await getJSON('https://es.wikipedia.org/w/api.php?action=query&list=search&srlimit=1&format=json&origin=*&srsearch='+encodeURIComponent(t));
  var r=s.query&&s.query.search&&s.query.search[0];
  if(!r)return {t:'',h:'<p>No encontré nada sobre eso. Prueba con otras palabras.</p>'};
  var m=await getJSON('https://es.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(r.title));
  var u=(m.content_urls&&m.content_urls.mobile&&m.content_urls.mobile.page)||('https://es.wikipedia.org/wiki/'+encodeURIComponent(r.title));
  return {t:'Wikipedia, "'+(m.title||r.title)+'": '+String(m.extract||'').slice(0,700),
   h:'<p><b>'+esc(m.title||r.title)+'</b></p><p>'+esc(m.extract||'')+'</p><div class="src">Fuente: Wikipedia · <a href="#" data-u="'+esc(u)+'">Ver artículo</a></div>'};
}
async function run(kind,text){
  if(busy)return;busy=true;sb.disabled=true;
  var b=typing();
  try{var r=await (kind==='dolar'?dolar():kind==='clima'?clima():kind==='noticias'?noticias():kind==='sismos'?sismos():wiki(text));b.innerHTML=r.h;SND.recv()}
  catch(e){b.textContent='No pude conectarme a internet. Revisa tu conexión e inténtalo otra vez.';SND.err()}
  finally{busy=false;sb.disabled=false;log.scrollTop=log.scrollHeight}
}

// ---------- Cerebro: IA conversacional ----------
async function llm(messages,maxTok,temp){
  var body={model:cfg.model,messages:messages,max_tokens:maxTok,temperature:temp};
  if(/gpt-oss/i.test(cfg.model))body.reasoning_effort='low';
  var r=await fetch(cfg.url,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+cfg.key},body:JSON.stringify(body)});
  var j;try{j=await r.json()}catch(e){j={}}
  if(!r.ok){var m=(j.error&&(j.error.message||j.error))||('Error '+r.status);var er=new Error(typeof m==='string'?m:JSON.stringify(m));er.status=r.status;throw er}
  var c=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
  return (c||'').trim();
}
function sys(){
  var ahora=new Date().toLocaleString('es-PE',{timeZone:'America/Lima',dateStyle:'full',timeStyle:'short'});
  return 'Eres Rayo, una mascota flotante veloz y simpática, inspirada en los superhéroes velocistas. Conversas como un amigo inteligente y cercano. Respondes en el idioma del usuario (por defecto español), claro, cálido y directo; breve salvo que pidan detalle. Puedes explicar, aconsejar, redactar, traducir, calcular y dar ideas sobre casi cualquier tema. No inventes datos: si no sabes algo, dilo. '+
  'Fecha y hora en Lima, Perú: '+ahora+'. '+
  'Si el mensaje trae un bloque [DATOS DE INTERNET], úsalo para los datos actuales y menciona la fuente; si no alcanza para responder, dilo con honestidad. Sin ese bloque no tienes datos en tiempo real. '+
  'En temas médicos, legales o financieros informa y sugiere consultar a un profesional. Formato: texto sencillo, **negrita** y listas con guiones. '+
  (mem.length?'LO QUE SABES DEL USUARIO (úsalo con naturalidad, sin recitarlo): '+mem.join('; ')+'. ':'Aún no conoces al usuario: si surge de forma natural, pregúntale su nombre y a qué se dedica. ');
}
async function contexto(t){
  var l=t.toLowerCase(),jobs=[];
  if(/d[oó]lar|tipo de cambio/.test(l))jobs.push(dolar());
  if(/clima|tiempo (hace|har[aá])|lluvi|temperatura|llover/.test(l))jobs.push(clima());
  if(/sismo|temblor/.test(l))jobs.push(sismos());
  if(!/d[oó]lar/.test(l)&&/noticia|hoy|[uú]ltim|reciente|actual|ocurri|pas[oó]|elecci|partido|resultado|precio/.test(l))jobs.push(noticias(t));
  else if(/qu[ií]en (es|fue)|qu[eé] es|qu[eé] fue|cu[aá]ndo|d[oó]nde (queda|est[aá])|significa|capital de|historia de/.test(l))jobs.push(wiki(t));
  if(!jobs.length)return '';
  var res=await Promise.all(jobs.map(function(p){return p.then(function(x){return x.t}).catch(function(){return ''})}));
  return res.filter(Boolean).join('\n\n').slice(0,2500);
}
function errMsg(e){
  var s=e&&e.status,m=String(e&&e.message||'');
  if(s===401||s===403)return 'La clave no es válida o no tiene permiso. Revísala en ⚙️.';
  if(s===429)return 'Llegué al límite gratis por ahora. Espera un minuto e inténtalo otra vez.';
  if(s===404||/model/i.test(m))return 'No encuentro ese modelo de IA. Cambia el nombre del modelo en ⚙️.';
  if(e instanceof TypeError)return 'No pude conectarme a internet. Revisa tu conexión.';
  return 'No pude responder: '+m.slice(0,200);
}
async function aprender(u,a){
  nuser++;ss('rayo_n',nuser);
  if(!(/recuerd|me llamo|mi nombre|soy |trabajo|vivo|me gusta|tengo |quiero |mi |mis |prefiero/i.test(u)||nuser%3===0))return;
  try{
    var out=await llm([{role:'system',content:'Extraes datos duraderos sobre el USUARIO (nombre, trabajo, lugar, gustos, metas, preferencias sobre cómo responderle). Responde SOLO con JSON: {"nuevos":["dato corto"]}. Máximo 3 datos, en español, sin repetir lo ya conocido: '+JSON.stringify(mem)+'. Si no hay nada nuevo: {"nuevos":[]}.'},{role:'user',content:'Usuario: '+u+'\nAsistente: '+String(a).slice(0,300)}],500,0);
    var m=out.match(/\{[\s\S]*\}/);if(!m)return;
    var j=JSON.parse(m[0]);
    (j.nuevos||[]).forEach(function(x){x=String(x).trim().slice(0,140);if(x&&!mem.some(function(y){return y.toLowerCase()===x.toLowerCase()}))mem.push(x)});
    mem=mem.slice(-60);ss('rayo_mem',mem);renderMem();
  }catch(e){}
}
function sinClave(t){
  var l=t.toLowerCase();
  if(!tip){tip=true;add('bot','Aún no tengo mi cerebro de IA. Toca ⚙️ y pega tu clave gratis para que podamos conversar. Mientras tanto busco datos en internet.',true)}
  if(/d[oó]lar|tipo de cambio/.test(l))run('dolar');
  else if(/clima|tiempo|lluvia|temperatura/.test(l))run('clima');
  else if(/noticia|titular/.test(l))run('noticias');
  else if(/sismo|temblor/.test(l))run('sismos');
  else run('wiki',t);
}
async function respond(t,ctxOver){
  busy=true;sb.disabled=true;pet.classList.add('think');
  var b=typing();
  try{
    var ctx=ctxOver!==undefined?ctxOver:await contexto(t);
    var msgs=[{role:'system',content:sys()}].concat(hist.slice(-8),[{role:'user',content:ctx?t+'\n\n[DATOS DE INTERNET]\n'+ctx:t}]);
    var out=await llm(msgs,1200,0.6);
    if(!out)out=await llm(msgs,2500,0.6);
    if(!out)out='No pude armar una respuesta. Intenta de nuevo.';
    b.innerHTML=fmt(out);
    SND.recv();buzz(20);speak(out);
    pet.classList.add('happy');setTimeout(function(){pet.classList.remove('happy')},700);
    hist.push({role:'user',content:t},{role:'assistant',content:out});hist=hist.slice(-30);ss('rayo_hist',hist);
    busy=false;sb.disabled=false;
    aprender(t,out);
  }catch(e){b.textContent=errMsg(e);SND.err()}
  finally{busy=false;sb.disabled=false;pet.classList.remove('think');log.scrollTop=log.scrollHeight}
}
async function ask(t){
  t=t.trim();if(!t||busy)return;
  add('me',t,true);q.value='';SND.send();
  if(!cfg.key){sinClave(t);return}
  respond(t);
}
async function miDia(){
  if(busy)return;
  add('me','☀️ Mi día',true);SND.send();
  if(!cfg.key){
    busy=true;var b=typing();
    try{var r=await Promise.all([clima().catch(function(){return null}),dolar().catch(function(){return null}),noticias().catch(function(){return null})]);b.innerHTML=r.filter(Boolean).map(function(x){return x.h}).join('<hr>')||'No pude conectarme a internet.';SND.recv()}
    finally{busy=false;log.scrollTop=log.scrollHeight}
    return;
  }
  var r=await Promise.all([clima().catch(function(){return null}),dolar().catch(function(){return null}),noticias().catch(function(){return null})]);
  var ctx=r.filter(Boolean).map(function(x){return x.t}).join('\n\n').slice(0,2500);
  respond('Hazme mi resumen del día: salúdame según la hora, dime el clima de Lima, el dólar, tres titulares importantes de Perú y un consejo breve para hoy.',ctx);
}

function landFx(strong){pet.classList.remove('land');void pet.offsetWidth;pet.classList.add('land');if(strong){SND.land();buzz(25)}else SND.soft();setTimeout(function(){pet.classList.remove('land')},650)}
window.rayoLean=function(a){
  sv.style.transform=a?'rotate('+a+'deg)':'';
